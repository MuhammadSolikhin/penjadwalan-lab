stages:
  - deploy

deploy_production:
  stage: deploy
  image: registry.unpam.ac.id/unpamofficial/skaffold:core

  script:
    # --- SKRIP DEBUGGING ---
    # Tujuan: Melihat isi file id_rsa sebelum digunakan.

    - echo "--- MEMULAI PROSES DEBUG ---"
    
    # 1. Setup direktori
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh

    # 2. Tulis key ke file
    - echo -e "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa

    # 3. CETAK ISI FILE KE LOG UNTUK INSPEKSI
    - echo "--- Mulai mencetak isi file /root/.ssh/id_rsa ---"
    - cat ~/.ssh/id_rsa
    - echo "--- Selesai mencetak isi file ---"
    - echo "Bandingkan teks di atas dengan file asli di laptop Anda."

    # 4. Kita akan tetap mencoba menjalankan ssh-add agar bisa melihat errornya lagi
    #    Namun, output debug di atas adalah yang paling penting.
    - echo "--- Mencoba menambahkan key ke ssh-agent ---"
    - eval $(ssh-agent -s)
    - ssh-add ~/.ssh/id_rsa

    # Jika baris di atas berhasil, skrip akan lanjut. Jika gagal, kita punya lognya.
    - '[[ -f /.dockerenv ]] && echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config'
    - |
      ssh $SSH_USER_HOST "
        echo 'Creating .env file on server...';
        echo '${ENV_FILE}' > ${PROJECT_PATH}/.env;

        if [ ! -d '$PROJECT_PATH' ]; then
          echo 'Project directory does not exist. Cloning repository...';
          git clone git@gitlab.unpam.ac.id:${CI_PROJECT_PATH}.git $PROJECT_PATH;
        fi;

        echo 'Executing deployment script on server...';
        cd $PROJECT_PATH && ./deploy.sh;
      "
  
  environment:
    name: production
    url: http://10.11.0.20
  
  only:
    - develop