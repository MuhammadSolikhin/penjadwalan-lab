stages:
  - deploy

deploy_production:
  stage: deploy
  image: registry.unpam.ac.id/unpamofficial/skaffold:core

  script:
    - echo "--- MEMULAI DEBUGGING VARIABEL ---"
    
    # Tes apakah variabelnya benar-benar kosong atau tidak
    - |
      if [ -z "$SSH_PRIVATE_KEY" ]; then
        echo "KESALAHAN FATAL: Variabel SSH_PRIVATE_KEY benar-benar KOSONG."
        exit 1
      else
        echo "INFO: Variabel SSH_PRIVATE_KEY memiliki isi."
      fi
    
    # Jika tidak kosong, kita lanjutkan seperti biasa dengan printf
    - printf "%s\n" "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - echo "--- Mencetak 50 karakter pertama dari file yang dibuat ---"
    - head -c 50 ~/.ssh/id_rsa
    - echo ""
    - echo "--- Selesai mencetak ---"
    
    # Lanjutkan sisa skrip...
    - eval $(ssh-agent -s)
    - chmod 600 ~/.ssh/id_rsa
    - ssh-add ~/.ssh/id_rsa
    # ... sisa skrip Anda ...