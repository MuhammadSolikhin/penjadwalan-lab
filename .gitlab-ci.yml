stages:
  - deploy

deploy_production:
  stage: deploy
  image: registry.unpam.ac.id/unpamofficial/skaffold:core

  before_script:
    - echo "Menyiapkan koneksi SSH..."
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - '[[ -f /.dockerenv ]] && echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config'
    - printf "%s\n" "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - eval $(ssh-agent -s)
    - ssh-add ~/.ssh/id_rsa
    - echo "Koneksi SSH siap."

  script:
    - |
      ssh $SSH_USER_HOST "
        # Pindah ke direktori proyek yang sudah ada
        cd $PROJECT_PATH;

        # Buat file .env terlebih dahulu
        echo 'Membuat file .env di server...';
        echo \"$ENV_FILE\" > .env;

        # Jalankan skrip deployment
        echo 'Menjalankan skrip deployment di server...';
        ./deploy.sh;
      "
  
  environment:
    name: production
    url: http://10.11.0.20
  
  only:
    - develop