services:
  app:
    build:
      context: .
      target: app             # build the "app" stage from Dockerfile
    image: penjadwalan-lab-app:prod
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_CHANNEL: stderr  
      # IMPORTANT: set your real APP_KEY (base64:...); don't commit it.
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: penjadwalan_lab
      DB_USERNAME: penjadwalan_lab
      DB_PASSWORD: penjadwalan_lab
    depends_on:
      db:
        condition: service_healthy
    networks: [app-network]
    volumes:
      # persist user uploads/logs etc.
      - app_storage:/var/www/storage
    # make sure perms are fine on first run, then start php-fpm
    command: >
      sh -lc '
        set -e;
        install -d -m 775 -o www-data -g www-data storage
        install -d -m 775 -o www-data -g www-data storage/logs storage/framework
        install -d -m 775 -o www-data -g www-data storage/framework/cache storage/framework/sessions storage/framework/views
        install -d -m 775 -o www-data -g www-data bootstrap/cache
        [ -f storage/logs/laravel.log ] || touch storage/logs/laravel.log
        chown -R www-data:www-data storage bootstrap/cache
        chmod -R ug+rwX,o-rwx storage bootstrap/cache
        exec php-fpm
      '

  node:
    image: node:20
    working_dir: /var/www
    volumes:
      - .:/var/www

  nginx:
    build:
      context: .
      target: nginx           # build the "nginx" stage from Dockerfile
    image: penjadwalan-lab-nginx:prod
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - app
    networks: [app-network]

  db:
    image: mariadb:10.6
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: penjadwalan_lab
      MYSQL_ROOT_PASSWORD: penjadwalan_lab
      MYSQL_PASSWORD: penjadwalan_lab
      MYSQL_USER: penjadwalan_lab
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--user=root", "--password=penjadwalan_lab"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      - MYSQL_DATABASE=${DB_DATABASE}
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_USER=${DB_USERNAME}
    volumes:
      - dbdata:/var/lib/mysql
    networks: [app-network]

networks:
  app-network:
    driver: bridge

volumes:
  dbdata:
  app_storage:
