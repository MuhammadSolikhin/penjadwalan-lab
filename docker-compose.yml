services:
  # The Application (PHP-FPM) Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: khinnn/penjadwalan_lab-app
    restart: unless-stopped
    volumes:
      - .:/var/www # Mount the code for development, can be removed for pure image-based prod
    environment:
      # These are read from the .env file on the host
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    networks:
      - app-network

  # The Web Server (Nginx) Service
  nginx:
    image: nginx:1.21-alpine
    restart: unless-stopped
    ports:
      - "80:80" # Expose port 80 to the outside world
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - app-network

  # The Database (MySQL) Service
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
    volumes:
      - dbdata:/var/lib/mysql
    # DO NOT expose the database port to the host in production for security
    # ports:
    #   - "3306:3306"
    networks:
      - app-network

# Define the network
networks:
  app-network:
    driver: bridge

# Define the persistent volume for the database
volumes:
  dbdata:
    driver: local