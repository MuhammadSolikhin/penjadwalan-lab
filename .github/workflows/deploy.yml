name: Deploy Laravel to VPS (CentOS 7)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Log in to DockerHub
      run: |
        echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ vars.DOCKERHUB_USERNAME }}" --password-stdin
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build Laravel Image
      run: |
        docker build -t ${{ vars.DOCKERHUB_USERNAME }}/penjadwalan_lab:latest .
    
    - name: Push Laravel Image to Docker Hub
      run: |
        docker push ${{ vars.DOCKERHUB_USERNAME }}/penjadwalan_lab:latest

    - name: Install sshpass for password-based SSH
      run: sudo apt-get update && sudo apt-get install -y sshpass

    - name: Setup SSH Host Key
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan -H ${{ vars.EC2_HOST }} >> ~/.ssh/known_hosts

    - name: Install Docker and Docker Compose on EC2 (CentOS 7)
      run: |
        sshpass -p "${{ secrets.EC2_PASSWORD }}" ssh ${{ vars.EC2_USER }}@${{ vars.EC2_HOST }} << "EOF"
          # Install Docker if not present
          if ! command -v docker &> /dev/null; then
            echo "Docker not found. Installing for CentOS 7..."
            sudo yum install -y yum-utils
            sudo yum-config-manager --add-repo https://download.docker.com/linux/centos/docker-ce.repo
            sudo yum install -y docker-ce docker-ce-cli containerd.io
            sudo systemctl start docker
            sudo systemctl enable docker
            sudo usermod -aG docker $USER
            echo "Docker installed."
          else
            echo "Docker already installed."
          fi

          # Install Docker Compose if not present
          if ! command -v docker-compose &> /dev/null; then
            echo "Docker Compose not found. Installing..."
            sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
            sudo chmod +x /usr/local/bin/docker-compose
            echo "Docker Compose installed."
          else
            echo "Docker Compose already installed."
          fi

          # Print versions
          docker --version
          docker-compose --version
        EOF
    
    - name: Copy docker-compose.yml and create .env on EC2
      run: |
        sshpass -p "${{ secrets.EC2_PASSWORD }}" ssh ${{ vars.EC2_USER }}@${{ vars.EC2_HOST }} "mkdir -p ${{ vars.EC2_PROJECT_PATH }}"
        sshpass -p "${{ secrets.EC2_PASSWORD }}" scp docker-compose.yml ${{ vars.EC2_USER }}@${{ vars.EC2_HOST }}:${{ vars.EC2_PROJECT_PATH }}
        sshpass -p "${{ secrets.EC2_PASSWORD }}" ssh ${{ vars.EC2_USER }}@${{ vars.EC2_HOST }} "echo '${{ secrets.ENV_FILE }}' > '${{ vars.EC2_PROJECT_PATH }}/.env'"

    - name: Deploy on EC2 via SSH
      run: |
        sshpass -p "${{ secrets.EC2_PASSWORD }}" ssh ${{ vars.EC2_USER }}@${{ vars.EC2_HOST }} << EOF
          cd ${{ vars.EC2_PROJECT_PATH }}

          echo "Pulling latest Laravel image..."
          sudo docker pull ${{ vars.DOCKERHUB_USERNAME }}/penjadwalan_lab:latest

          echo "Stopping existing containers..."
          sudo docker-compose down || true

          echo "Starting Laravel containers..."
          sudo docker-compose up -d

          echo "Waiting for MySQL to be ready..."
          until sudo docker-compose exec db mysqladmin ping -h "localhost" --silent; do
            echo "Waiting for database..."
            sleep 5
          done

          echo "Running Laravel migrations..."
          sudo docker-compose exec app php artisan migrate --force

          echo "Deployment successful!"
        EOF