name: Deploy Laravel to AWS EC2

on:
  push:
    branches:
      - develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Log in to DockerHub
      run: |
        echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ vars.DOCKERHUB_USERNAME }}" --password-stdin
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build Laravel Image
      run: |
        docker build -t ${{ vars.DOCKERHUB_USERNAME }}/penjadwalan_lab:latest .
    
    - name: Push Laravel Image to Docker Hub
      run: |
        docker push ${{ vars.DOCKERHUB_USERNAME }}/penjadwalan_lab:latest

    - name: Setup SSH access
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ vars.EC2_HOST }} >> ~/.ssh/known_hosts

    - name: Install Docker and Docker Compose on EC2 if missing
      run: |
          ssh ${{ vars.EC2_USER }}@${{ vars.EC2_HOST }} << "EOF"
            # Install Docker if not present
            if ! command -v docker &> /dev/null; then
              echo "Docker not found. Installing..."
              sudo apt-get update
              sudo apt-get install -y ca-certificates curl gnupg lsb-release
      
              # Add Docker’s official GPG key
              sudo install -m 0755 -d /etc/apt/keyrings
              curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
      
              # Set up the repository
              echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] \
              https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | \
              sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
      
              sudo apt-get update
              sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
      
              echo "Docker installed."
            else
              echo "Docker already installed."
            fi
      
            # Start Docker if needed
            if ! sudo systemctl is-active --quiet docker; then
              sudo systemctl start docker
              sudo systemctl enable docker
            fi
      
            # Print versions
            docker --version
            docker compose version
          EOF
    
    - name: Copy docker-compose.yml to EC2
      run: |
        ssh ${{ vars.EC2_USER }}@${{ vars.EC2_HOST }} "mkdir -p ${{ vars.EC2_PROJECT_PATH }}"
        scp docker-compose.yml ${{ vars.EC2_USER }}@${{ vars.EC2_HOST }}:${{ vars.EC2_PROJECT_PATH }}
    
      
    - name: Deploy on EC2 via SSH
      run: |
        ssh ${{ vars.EC2_USER }}@${{ vars.EC2_HOST }} << EOF
          cd ${{ vars.EC2_PROJECT_PATH }}
          echo "Pulling latest Laravel image..."
          sudo docker pull ${{ vars.DOCKERHUB_USERNAME }}/penjadwalan_lab:latest

          echo "Stopping existing containers..."
          sudo docker compose down || true

          echo "Starting Laravel containers..."
          sudo docker compose up -d

          echo "Running Laravel migrations..."
          sudo docker compose exec app php artisan migrate --force
        EOF
